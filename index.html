    <!-- Guard against duplicate CustomElement definitions (prevents puter-dialog collisions) -->
    <script>
      if (typeof window !== 'undefined' && window.customElements) {
        const _origDef = window.customElements.define.bind(window.customElements);
        window.customElements.define = function(name, constructor, options) {
          if (!window.customElements.get(name)) {
            _origDef(name, constructor, options);
          }
        };
      }
    </script>

    <!-- Puter.js: Free Unlimited AI Vision, Auth & Cloud APIs -->
    <script src="https://js.puter.com/v2/"></script>
